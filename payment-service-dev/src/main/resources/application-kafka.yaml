spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      retries: 5
      properties:
        spring.json.add.type.headers: false

    consumer:
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: 'com.globus.payment_service.dto.*'
        spring.use.type.headers: false

LOAN_PAYMENT_DIRECT_TOPIC: "loan.payment.direct-events"
ACCOUNT_PAYMENT_DIRECT_TOPIC: "account.payment.direct-events"
PAYMENT_CLAIM_DIRECT_TOPIC: "payment.claim.direct-events"
PAYMENT_ACCOUNT_DIRECT_TOPIC: "payment.account.direct-events"
