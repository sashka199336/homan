spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/glb_2_23
    username: postgres
    password: postgres
    hikari:
      schema: payment_schema
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS payment_schema
      connection-timeout: 6000
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    show-sql: false
    defer-datasource-initialization: true

  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.yml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      retries: 5
      properties:
        spring.json.add.type.headers: false

    consumer:
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: 'com.globus.payment_service.dto.*'
        spring.use.type.headers: false
    admin:
      auto-create: true

logging:
  level:
    com.globus.payment_service: TRACE
    org.apache.kafka: WARN
