server:
  port: 8337

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/session_tracing_service
    username: postgres
    password: 1

  data:
    redis:
      host: localhost
      port: 6379
      lifetime:
        minutes: 30

  jpa:
    open-in-view: true
    show-sql: false
    properties:
      hibernate:
        ddl-auto: update
        format_sql: true
#    database-platform: org.hibernate.dialect.PostgreSQLDialect

sessions:
  page:
    quantity: 5
  life:
    days: 183
    task:
      cron:
        delete-old: 0 * * * * *
        delete-not-active: 0 */5 * * * *
