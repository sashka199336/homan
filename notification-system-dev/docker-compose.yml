services:
  email-notification-ms:
    build:
      context: .
      args:
        MODULE: email-notification-ms
        APP_PORT: 8083
    container_name: email-notification-ms

    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_TO=${EMAIL_TO}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - LOGSTASH_HOST=${LOGSTASH_HOST}
      - LOGSTASH_PORT=${LOGSTASH_PORT}
    ports:
      - "8094:8083"
    restart: unless-stopped
    networks:
      - microservice-network

  kafka-test-producer:
    build:
      context: .
      args:
        MODULE: kafka-test-producer
        APP_PORT: 8081
    container_name: kafka-test-producer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - LOGSTASH_HOST=${LOGSTASH_HOST}
      - LOGSTASH_PORT=${LOGSTASH_PORT}
    ports:
      - "8092:8081"
    restart: unless-stopped
    networks:
      - microservice-network

  notification-app:
    build:
      context: .
      args:
        MODULE: notification-app
        APP_PORT: 8082
    container_name: notification-app
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - LOGSTASH_HOST=${LOGSTASH_HOST}
      - LOGSTASH_PORT=${LOGSTASH_PORT}
    ports:
      - "8086:8082"
    restart: unless-stopped
    networks:
      - microservice-network

  sms-notification-ms:
    build:
      context: .
      args:
        MODULE: sms-notification-ms
        APP_PORT: 8084
    container_name: sms-notification-ms
    environment:
      - SMS_API_KEY=${SMS_API_KEY}
      - SMS_TEST_PHONE=${SMS_TEST_PHONE}
      - SMS_TEST=${SMS_TEST}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - LOGSTASH_HOST=${LOGSTASH_HOST}
      - LOGSTASH_PORT=${LOGSTASH_PORT}
    ports:
      - "8093:8084"
    restart: unless-stopped
    networks:
      - microservice-network

networks:
  microservice-network:
    external: true
