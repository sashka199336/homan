server:
  port: ${SERVER_PORT:8082}
  forward-headers-strategy: framework
  servlet:
    context-path: /notification-app

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:notification-system}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.use.type.headers: true
        spring.json.type.mapping: ${KAFKA_PRODUCER_TYPE_MAPPING:EmailNotificationDto:ru.globus.notificationsystem.dto.request.EmailNotificationDto,SmsNotificationDto:ru.globus.notificationsystem.dto.request.SmsNotificationDto,PushNotificationDto:ru.globus.notificationsystem.dto.request.PushNotificationDto,WebNotificationDto:ru.globus.notificationsystem.dto.request.WebNotificationDto}
      topic:
        email-notifications: ${KAFKA_TOPIC_EMAIL:email-notifications-topic}
        sms-notifications: ${KAFKA_TOPIC_SMS:sms-notifications-topic}
        push-notifications: ${KAFKA_TOPIC_PUSH:push-notifications-topic}
        web-notifications: ${KAFKA_TOPIC_WEB:web-notifications-topic}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:notification-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      topic:
        notifications: ${KAFKA_TOPIC_NOTIFICATIONS:notifications-topic}
        notifications-rule: ${KAFKA_TOPIC_RULE:notifications-rule-topic}
        notification-responses: ${KAFKA_TOPIC_RESPONSES:notification-responses-topic}
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: ${KAFKA_TRUSTED_PACKAGES:ru.globus.notificationsystem.dto.request,ru.globus.notificationsystem.dto.response}
        spring.json.use.type.headers: true
        spring.json.type.mapping: ${KAFKA_CONSUMER_TYPE_MAPPING:NotificationDto:ru.globus.notificationsystem.dto.request.NotificationDto,NotificationRuleDto:ru.globus.notificationsystem.dto.request.NotificationRuleDto,NotificationResponse:ru.globus.notificationsystem.dto.response.NotificationResponse}
    listener:
      missing-topics-fatal: ${KAFKA_MISSING_TOPICS_FATAL:false}
      ack-mode: BATCH
      type: BATCH
  datasource:
    url: ${POSTGRES_URL}/${POSTGRES_DB}  # jdbc:postgresql://localhost:5432/notification_db?currentSchema=notifications
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    hikari:
      schema: ${POSTGRES_SCHEMA:notifications}
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS ${POSTGRES_SCHEMA:notifications}
      connection-timeout: 6000
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      jdbc:
        lob:
          non_contextual_creation: true
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        id:
          uuid_generator_strategy: org.hibernate.id.uuid.StandardRandomStrategy
        default_schema: notifications
    database-platform: org.hibernate.dialect.PostgreSQLDialect

logging:
  config: classpath:logback.xml
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.springframework: ${LOGGING_LEVEL_SPRING:DEBUG}
    org.springframework.kafka: ${LOGGING_LEVEL_KAFKA:DEBUG}
    ru.globus.notificationsystem: ${LOGGING_LEVEL_APP:DEBUG}
    org.springframework.kafka.support.serializer.JsonDeserializer: TRACE
  file:
    path: logs
    name: logs/notification-app.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus  # Какие endpoint доступны
  endpoint:
    health:
      show-details: always             # Детализация health-статуса
    info:
      env:
        include: app.version           # Какие данные включать в /info
  server:
    port: 8099

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger
    display-operation-id: true
    try-it-out-enabled: true
