server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework
  servlet:
    context-path: /gateway
client-origin:
    url: https://swagger-labs.globus-ltd.com

spring:
  application:
    name: api-gateway
  cloud:
    compatibility-verifier.enabled: false
    gateway:
      discovery:
        default-filters:
          - TokenRelay
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: http://user-service:8888
          predicates:
            - Path=/gateway/user-service/api/v1/users/**
          filters:
            - StripPrefix=1
            - name: JwtRoleFilter

        - id: claim-service
          uri: http://claim-service:8091
          predicates:
            - Path=/gateway/claim-service/api/v1/claims/**
          filters:
            - StripPrefix=1
            - name: JwtRoleFilter

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT:api-gateway}
            client-secret: ${KEYCLOAK_SECRET:tAovepwcNYCYL93uSlB2JFOAB5542Uj5}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_URL}/${KEYCLOAK_REALMS}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL}/${KEYCLOAK_REALMS}
          jwk-set-uri: ${KEYCLOAK_URL}/${KEYCLOAK_REALMS}/protocol/openid-connect/certs

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, gateway, prometheus
  endpoint:
    health:
      show-details: always
    info:
      env:
        include: app.version
  server:
    port: 8099
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO