server:
  port: 8091
  forward-headers-strategy: framework
  servlet:
    context-path: /claim-service


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger
    display-operation-id: true
    try-it-out-enabled: true

client-origin:
  url: https://swagger-labs.globus-ltd.com

spring:
  application:
    name: claim-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432}/${POSTGRES_DB:claim_db}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USERNAME:admin}
    password: ${POSTGRES_PASSWORD:admin}
    hikari:
      schema: ${POSTGRES_SCHEMA:claim_schema}
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS ${POSTGRES_SCHEMA:claim_schema}
      connection-timeout: 6000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default-schema: ${POSTGRES_SCHEMA:claim_schema}
        jdbc:
          lob:
            non_contextual_creation: true
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    default-schema: ${POSTGRES_SCHEMA:claim_schema}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:claim-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      topics:
        loan-claim: loan.claim.decision
        account-response: claim.direct.response
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.globus.claim_service.dto.*, com.globus.claim_service.event
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.headers: true
        spring.json.type.mapping: |
          NotificationDto:com.globus.claim_service.event.NotificationEvent,
          LoanAppEvent:com.globus.claim_service.event.LoanAppEvent,
          AccountRequest:com.globus.claim_service.event.AccountRequest
        spring.json.trusted.packages: "com.globus.claim_service.event"
    topic:
      loan-created: claim.loan.created
      loan-confirmed: claim.loan.confirmed
      notification: notifications-topic
      account-events: account.events
      payment-events: payment.claim.direct-events
    listener:
      missing-topics-fatal: false
      ack-mode: BATCH
      type: BATCH

app:
  feignClient:
    url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}



logging:
  level:
    liquibase: DEBUG
    org.apache.kafka: INFO
    org.springframework.kafka: DEBUG
    org.springframework.jdbc.core: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.kafka.config: DEBUG
    org.springframework.kafka.listener: DEBUG


management:
  server:
    port: 8099
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    info:
      env:
        enabled: true
        include: app.version
